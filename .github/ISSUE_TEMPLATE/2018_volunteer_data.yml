name: 2018 T2 Mac Volunteer Data
description: Submit hardware dumps, USB port maps, opencore-*.txt logs, or BridgePatcher captures for 2018 T2 Mac Tahoe R&D
title: "[2018 Mac Data] <Model> - <Mode>"
labels: ["2018-volunteer-data"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping gather real hardware data for 2018 T2 Macs (`MacBookAir8,1`, `MacBookPro15,1`, `MacBookPro15,2`, `Macmini8,1`).

        1. Run `zsh ./collect_2018_mac_diagnostics.command` (see `2018-volunteer-kit/README.md` on the `rd/2018-mac-support` branch).
        2. Drag and drop the generated `2018-mac-diag-*.zip` directly into the **Bundle Attachment** box below (up to 25 MB; Serial/MLB/SystemUUID/ROM/MAC/usernames are automatically removed).
  - type: dropdown
    id: model
    attributes:
      label: Mac Model Identifier
      description: Run `sysctl -n hw.model` in Terminal if unsure.
      options:
        - MacBookAir8,1
        - MacBookPro15,1
        - MacBookPro15,2
        - Macmini8,1
        - MacBookAir8,2 (2019 sibling)
        - MacBookPro15,3 (2019 sibling)
        - MacBookPro15,4 (2019 sibling)
        - Other T2 Mac
    validations:
      required: true
  - type: dropdown
    id: capture-mode
    attributes:
      label: Capture Mode Used
      options:
        - "Mode 1: Native macOS Hardware & USB Map"
        - "Mode 2: External USB Debug OpenCore (opencore-*.txt / Panic)"
        - "Mode 3: BridgePatcher Reference Capture"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS Version(s)
      description: Native macOS version used to run the collector, plus Tahoe build if testing Mode 2 or 3.
      placeholder: "e.g. Native Sequoia 15.7.2; tested Tahoe 26.x on external USB SSD"
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-Capture Checks
      options:
        - label: "Mode 1: I briefly plugged a USB device into every USB-A / USB-C / Thunderbolt port before running the script so all XHCI controllers appeared in IORegistry."
        - label: "Mode 2 / 3: I used a separate test USB/external volume (internal drive untouched) and mounted the test EFI partition before running `--efi /Volumes/EFI`."
  - type: textarea
    id: bundle
    attributes:
      label: Bundle Attachment (`2018-mac-diag-*.zip`) & Panic Photo
      description: Drag and drop your `2018-mac-diag-*.zip` file here. For Mode 2 hangs/panics, also attach a photo of the verbose panic screen. If larger than 25 MB, paste a download link.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Mention where boot stopped, BridgePatcher options/kexts used, or any unusual hardware (eGPU, non-Apple NVMe, etc.).
